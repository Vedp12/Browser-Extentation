<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
 .container {
  width: 450px;
  /*border-radius: 8px;*/
  background: transparent;
  /*border: 2px solid rgba(255, 255, 255, 0.20);*/
  border-radius: 24px;
  color: #fff;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
  box-shadow: 0 10px 20px rgba(0,0,0,0.05);
	}

	.container p {
  font-weight: 600;
  font-size: 1.31rem;
  padding: 1rem 1.75rem;
  background: transparent;
  /*border: 2px solid rgba(255, 255, 255, 0.12);*/
  border-radius: 24px;
  color: #fff;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
	}

	#password-inputbox{

	width: 60%;
	}


	.wrapper {
  margin: 1.25rem 1.75rem;
	}

	.wrapper .input-box {
  position: relative;
	}

	.input-box input {
  width: 100%;
  height: 53px;
  font-size: 1.06rem;
  font-weight: 500;
  border-radius: 4px;
  letter-spacing: 1.4px;
  padding: 0 2.85rem 0 1rem;
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 24px;
  color: #fff;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
	}

	.input-box span {
  position: absolute;
  right: 13px;
  cursor: pointer;
  line-height: 53px;
  color: #000;
	}

	.input-box span:hover {
  color: #46495E!important;
	}

	.wrapper .pass-settings {
  margin: 1.56rem 0 1.25rem;
	}

	.pass-settings .options {
  display: flex;
  list-style: none;
  flex-wrap: wrap;
  margin-top: 1rem;
	}

	.pass-settings .options .option {
  display: flex;
  align-items: center;
  margin-bottom: 1rem;
  width: calc(100% / 2);
	}

	.options .option:first-child input {
  opacity: 0.7;
	}

	.options .option input {
  height: 16px;
  width: 16px;
  cursor: pointer;
	}

	.options .option label {
  cursor: pointer;
  color: #000;
  padding-left: 0.63rem;
	}

	.pass-settings input[type='checkbox'] {
  accent-color: #46496E;
	}

	.wrapper .generate-btn {
  width: 50%;
  border: none;
  outline: none;
  cursor: pointer;
  font-size: 0.8rem;
  padding: 0.94rem 0;
  border-radius: 5px;
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 24px;
  color:black;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
  text-transform: uppercase;
  margin-bottom: 4% ;
  margin-left: 20%;
	}

	.wrapper .generate-btn:hover {
  background: oklch(96% 0% 90);
	}

	</style>
</head>
<body>
    <!--* Password generatro------------------------------------------------------->
    <div class="container">
          <!--* close button -->
          <button>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left-square" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm11.5 5.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/>
              </svg>
          </button>

          <div class="wrapper">
            <div class="input-box">
              <input disabled="" type="text" id="password-inputbox">
              <span>Copy</span>
            </div>
            <div class="pass-settings">
              <label class="title">Password Settings</label>
              <ul class="options">
                <li class="option">
                  <input checked="" id="lowercase" type="checkbox">
                  <label for="lowercase">Lowercase (a-z)</label>
                </li>
                <li class="option">
                  <input id="uppercase" type="checkbox">
                  <label for="uppercase">Uppercase (A-Z)</label>
                </li>
                <li class="option">
                  <input id="numbers" type="checkbox">
                  <label for="numbers">Numbers (0-9)</label>
                </li>
                <li class="option">
                  <input id="symbols" type="checkbox">
                  <label for="symbols">Symbols (!-$^+)</label>
                </li>
              </ul>
            </div>
            <button class="generate-btn">Generate Password</button>
          </div>
    </div>

</body>
</html>
