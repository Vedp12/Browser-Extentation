<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            background: #030303;
        }

        h2 {
            margin-bottom: 20px;
        }

        .camera-btn-class {
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 7px;
            background: #007bff;
            color: white;
            margin: 5px;
        }

        .camera-btn-class:hover {
            background: #0056b3;
        }

        .camera-btn-class:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #camera-screen {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        #frame {
            position: relative;
        }

        #camera,
        #photo {
            display: block;
            width: 100%;
            background: #222;
            border-radius: 10px;
        }

        #photo {
            position: absolute;
            inset: 0;
            height: 100%;
            object-fit: cover;
        }

        #status {
            margin-top: 15px;
            color: #444;
        }

        /* Keep elements completely hidden until requested. */
        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <h2>Camera App</h2>

    <button id="toggle-camera" type="button">
        Show Camera
    </button>

    <!-- Hidden until the user opens the camera -->
    <section id="camera-screen" hidden>
        <div id="frame">
            <video id="camera" autoplay muted playsinline></video>

            <!-- Captured photo is shown directly over the video, no second image -->
            <img id="photo" alt="Your captured photo" hidden>
        </div>

        <div>
            <button id="take-photo" type="button" class="camera-btn-class">
                Take Photo
            </button>

            <!-- Only appears once, after a photo is taken -->
            <button id="save-photo" type="button" hidden class="camera-btn-class">
                Save Photo
            </button>

            <button id="retake-photo" type="button" hidden class="camera-btn-class">
                Retake
            </button>

            <button id="close-camera" type="button" hidden class="camera-btn-class">
                Close Camera
            </button>
        </div>
    </section>

    <p id="status">Click "Show Camera" to start.</p>

    <!-- Used internally to capture a frame -->
    <canvas id="canvas" hidden></canvas>

    <script>
        const camera = document.getElementById("camera");
        const cameraScreen = document.getElementById("camera-screen");
        const toggleBtn = document.getElementById("toggle-camera");
        const takePhotoBtn = document.getElementById("take-photo");
        const savePhotoBtn = document.getElementById("save-photo");
        const retakeBtn = document.getElementById("retake-photo");
        const closeBtn = document.getElementById("close-camera");
        const photo = document.getElementById("photo");
        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");

        let stream = null;
        let cameraOpening = false;

        async function showCamera() {
            if (cameraOpening || stream) return;

            cameraOpening = true;
            toggleBtn.disabled = true;
            status.textContent = "Requesting camera permission...";

            try {
                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {
                    throw new Error(
                        "Camera access requires HTTPS or localhost."
                    );
                }

                // Reveal the camera screen only after the user clicks.
                cameraScreen.hidden = false;
                resetPhoto();

                const newStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" },
                        audio: false
                    });

                stream = newStream;
                camera.srcObject = stream;

                await camera.play();

                // toggleBtn.textContent = "Close Camera";
                status.textContent = "Camera is ready. Take a photo.";

            } catch (error) {
                console.error("Camera error:", error);

                cameraScreen.hidden = true;

                if (error.name === "NotAllowedError") {
                    status.textContent =
                        "Camera permission denied. Allow camera access in your browser.";
                } else if (error.name === "NotFoundError") {
                    status.textContent =
                        "No camera was found on this device.";
                } else if (error.name === "NotReadableError") {
                    status.textContent =
                        "Camera is busy. Close other apps using it.";
                } else {
                    status.textContent =
                        "Unable to start camera: " + error.message;
                }

                stopCameraStream();

            } finally {
                cameraOpening = false;
                toggleBtn.disabled = false;
            }
        }

        function stopCameraStream() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            camera.pause();
            camera.srcObject = null;
        }

        function closeCamera() {
            stopCameraStream();

            resetPhoto();
            cameraScreen.hidden = true;
            toggleBtn.textContent = "Show Camera";
            status.textContent = "Camera closed.";
        }

        function resetPhoto() {
            capturedDataUrl = null;
            photo.removeAttribute("src");
            photo.hidden = true;
            closeBtn.hidden = true;
            savePhotoBtn.hidden = true;
            retakeBtn.hidden = true;
            takePhotoBtn.hidden = false;
        }

        let capturedDataUrl = null;

        function savePhoto() {
            if (!capturedDataUrl) {
                status.textContent = "Take a photo first.";
                return;
            }

            const link = document.createElement("a");
            link.href = capturedDataUrl;
            link.download = "photo-" + Date.now() + ".jpg";
            document.body.appendChild(link);
            link.click();
            link.remove();

            status.textContent = "Photo saved to your downloads.";
        }

        function takePhoto() {
            if (
                !stream ||
                !camera.videoWidth ||
                !camera.videoHeight
            ) {
                status.textContent =
                    "Camera is not ready. Please wait a moment.";
                return;
            }

            // Match the canvas dimensions to the camera frame.
            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;

            const context = canvas.getContext("2d");

            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Show the captured frame directly over the video preview.
            capturedDataUrl = canvas.toDataURL("image/jpeg", 0.92);
            photo.src = capturedDataUrl;
            photo.hidden = false;

            // Photo actions appear once, right after the photo is taken.
            closeBtn.hidden = false;
            savePhotoBtn.hidden = false;
            retakeBtn.hidden = false;
            takePhotoBtn.hidden = true;

            status.textContent = "Photo captured. Save it or retake.";
        }

        toggleBtn.addEventListener("click", () => {
            if (stream) {
                closeCamera();
            } else {
                showCamera();
            }
        });

        closeBtn.addEventListener("click", closeCamera);

        takePhotoBtn.addEventListener("click", takePhoto);

        savePhotoBtn.addEventListener("click", savePhoto);

        retakeBtn.addEventListener("click", () => {
            resetPhoto();
            status.textContent = "Retake your photo.";
        });
    </script>

</body>
</html>
