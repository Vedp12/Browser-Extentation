<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f6;
      --surface: #ffffff;
      --border: #e7e7ec;
      --text: #16161a;
      --muted: #7a7a85;
      --hover: #f1f1f5;
      --danger: #e5484d;
      --danger-bg: #fdecec;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
    

    /* Card */
    .card {
      width: 100%;
      max-width: 340px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .card:hover { transform: translateY(-2px); }

    .icon {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f58529, #dd2a7b 50%, #8134af);
      transition: transform .25s ease;
    }
    .card:hover .icon { transform: scale(1.05) rotate(-3deg); }

    .content { flex: 1; min-width: 0; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }
    .title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

    .url {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .url:hover { color: var(--text); }

    /* Delete button */
    .delete {
      flex: none;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .1s ease;
    }
    .delete svg { width: 15px; height: 15px; }
    .delete:hover, .delete:focus-visible { background: var(--danger-bg); color: var(--danger); outline: none; }
    .delete:active { transform: scale(.92); }

    /* Dropdown menu */
    .menu { position: relative; display: inline-block; margin-top: 12px; }

    .menu-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font: 500 12px/1 'Poppins', system-ui, sans-serif;
      color: var(--text);
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      transition: background .2s ease;
    }
    .menu-trigger svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .25s ease;
    }

    .submenu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 10;
      min-width: 160px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    /* invisible bridge so hover doesn't drop in the gap */
    .submenu::before { content: ""; position: absolute; inset: -8px 0 auto 0; height: 8px; }

    .menu:hover .submenu,
    .menu:focus-within .submenu { opacity: 1; visibility: visible; transform: translateY(0); }
    .menu:hover .menu-trigger svg,
    .menu:focus-within .menu-trigger svg { transform: rotate(180deg); }

    .submenu a {
      display: block;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      transition: background .15s ease;
    }
    .submenu a:hover, .submenu a:focus-visible { background: var(--hover); outline: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true"></div>

    <div class="content">
      <div class="top">
        <h1 class="title">Instagram</h1>
        <button class="delete" aria-label="Delete Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>

      <a class="url" href="https://instagram.com">instagram.com</a>

      <div class="menu">
        <a href="#" class="menu-trigger">
          Our Services
          <svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg>
        </a>
        <div class="submenu">
          <a href="#">Development</a>
          <a href="#">Design</a>
          <a href="#">Marketing</a>
          <a href="#">SEO</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
