<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* From Uiverse.io by SachinKumar666 */ 
.items_card {
    width: 320px;
    min-height: 220px;

    background: #fff;
    border-radius: 18px;
    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);

    padding: 20px;
    box-sizing: border-box;
}

.items_card__content {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
}

/* Small Logo/Icon */
.items_card__image {
    width: 48px;
    height: 48px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f8fafc;
    border: 1px solid #e5e7eb;
}

.items_card__image img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

/* Form Area */
.items_card__text {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* Title Input */
.items_card__title {
    width: 100%;
    height: 44px;

    border: none;
    border-bottom: 2px solid #d1d5db;

    font-size: 1rem;
    font-weight: 600;

    padding: 0 4px;
    outline: none;

    background: transparent;
}

.items_card__title:focus {
    border-color:rgb(72, 138, 236);
}

/* URL Input */
.items_card__description {
    width: 100%;
    height: 34px;

    border: none;
    border-bottom: 1px solid #d1d5db;

    font-size: 0.85rem;
    color: #64748b;

    padding: 0 4px;
    outline: none;

    background: transparent;
}

.items_card__description:focus {
    border-color: rgb(72, 138, 236);
}

/* Footer */
.items_card__footer {
    width: 100%;
    margin-top: auto;

    display: flex;
    justify-content: flex-end;
}

/* Small Simple Button */
#save-items-btn {
    height: 32px;
    padding: 0 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;

    background: rgb(72, 138, 236);
    color: white;

    font-size: 0.8rem;
    font-weight: 500;

    cursor: pointer;
    transition: 0.2s;
}

#save-items-btn:hover {
    background:rgb(37, 99, 235);
}
    </style>
</head>

<body>
    <!-- From Uiverse.io by SachinKumar666 --> 
<div class="items_card">
    <div class="items_card__shine"></div>

    <div class="items_card__content">
        <div class="items_card__image">
    <img id="site-logo"
         src="https://www.google.com/favicon.ico"
         alt="Website Logo">
</div>

        <div class="items_card__text">
            <input
                placeholder="Enter Title"
                class="items_card__title"
                type="text"
            >

            <input
                placeholder="Enter URL"
                class="items_card__description"
                type="url"
            >
        </div>

        <div class="items_card__footer">
            <button id="save-items-btn" type="submit">
                Save
            </button>
        </div>
    </div>
</div>
</body>
</html>
