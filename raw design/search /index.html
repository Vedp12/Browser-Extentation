<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form class="formsearch" role="search" method="POST">
    <input type="hidden" name="form_type" value="browser_search_result">

    <svg width="17" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9"
            stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
    </svg>

    <input
        class="browser_search"
        placeholder="Search the Internet..."
        name="browser_search"
        type="text">

<div class="select-box">
    <select name="provider">
        <option value="DuckDuckGo">DuckDuckGo</option>
        <option value="Google">Google</option>
        <option value="Perplexity">Perplexity</option>
    </select>
</div>

<div class="dropdown-footer">
    <button type="reset" class="btn-secondary">Reset</button>
    <button type="submit" class="btn-primary">Confirm</button>
</div>

    <button type="submit">Search</button>
</form>
</body>
</html>
